<main class="auth-page" *transloco="let t">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="auth-card__title">Pulsequorum</h1>
    <p class="auth-card__subtitle">{{ t('auth.login.title') }}</p>

    @if (expired()) {
      <p class="auth-card__notice" role="status">{{ t('auth.login.expired') }}</p>
    }

    @if (oidc()) {
      <button mat-flat-button type="button" (click)="signIn()">{{ t('auth.login.submit') }}</button>
    } @else {
      @if (error(); as e) {
        <p class="auth-card__error" role="alert">{{ t(e.key, { seconds: e.retryAfter ?? '' }) }}</p>
      }

      <mat-form-field appearance="outline">
        <mat-label>{{ t('auth.username') }}</mat-label>
        <input
          matInput
          formControlName="username"
          autocomplete="username"
          autocapitalize="none"
          required
        />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>{{ t('auth.password') }}</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
          required
        />
      </mat-form-field>

      <button mat-flat-button type="submit" [disabled]="busy()">
        {{ t('auth.login.submit') }}
      </button>
      <a class="auth-card__link" routerLink="/setup">{{ t('auth.login.toSetup') }}</a>
    }
  </form>
</main>

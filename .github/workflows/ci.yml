# CI per ADR 0009 and ADR 0040. Every job calls the same Makefile targets as local
# development. Hardening: no workflow-level permissions, least privilege per job,
# credentials never persisted, every action pinned to a full commit SHA.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # make go-test in shards on separate runners (GO_TEST_HEAVY in the
  # Makefile): under -race the slowest packages are CPU-bound and would
  # starve each other on one runner. Each shard uploads its coverage profile.
  go-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with GO_TEST_HEAVY and SHARD_COUNT in the go job.
        shard: [rest, api, cluster, clusterhost]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make go-test-shard SHARD=${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          if-no-files-found: error
          retention-days: 1

  # Required check for the Go tests: passes only if every shard passed and
  # merges their profiles into the go-coverage artifact (coverage.out) that
  # the sonarcloud job reads. It runs even if a shard failed, because a
  # skipped required check would count as passed.
  go:
    needs: [go-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All test shards passed
        env:
          SHARDS_RESULT: ${{ needs.go-test.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::go-test shards: $SHARDS_RESULT"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-coverage-*
          path: shards
          merge-multiple: true
      - name: Merge the shard profiles into coverage.out
        env:
          SHARD_COUNT: 4
        run: |
          set -euo pipefail
          shopt -s nullglob
          profiles=(shards/coverage-*.out)
          if [ "${#profiles[@]}" -ne "$SHARD_COUNT" ]; then
            echo "::error::expected $SHARD_COUNT shard profiles, got ${#profiles[@]}"
            exit 1
          fi
          for f in "${profiles[@]}"; do
            if [ "$(head -n 1 "$f")" != "mode: atomic" ]; then
              echo "::error::$f is not an atomic coverage profile"
              exit 1
            fi
          done
          {
            echo "mode: atomic"
            for f in "${profiles[@]}"; do tail -n +2 "$f"; done
          } > coverage.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

  golangci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # go vet, gofmt and govulncheck need no test run; they moved here from
      # the go job when the tests were split into shards.
      - run: make go-lint
      - name: govulncheck (pinned in tools/go.mod)
        run: go tool -modfile=tools/go.mod govulncheck ./cmd/... ./internal/... ./build/...

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-lint web-test web-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage/pulsequorum-web/lcov.info
          if-no-files-found: error
          retention-days: 1
      # npm audit --audit-level=high with reviewed, expiring exceptions
      # (web/scripts/audit-exceptions.json).
      - run: node scripts/audit.mjs
        working-directory: web

  # SonarCloud analysis with the coverage reports of the go and web jobs, so no
  # test runs twice. Settings: sonar-project.properties.
  sonarcloud:
    needs: [go, web]
    # SONAR_TOKEN is not available to pull requests from forks or from Dependabot;
    # never use pull_request_target or a Dependabot secret to work around that. A
    # skipped job satisfies the required check; master is analysed after the merge.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for blame and new-code detection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-coverage
          path: web/coverage/pulsequorum-web
      - name: Make web coverage paths relative to the repository root
        run: sed -i 's#^SF:#SF:web/#' web/coverage/pulsequorum-web/lcov.info
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make licenses

  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make generate-check

  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: actionlint (pinned in tools/go.mod)
        run: go tool -modfile=tools/go.mod actionlint
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Offline audits only; findings fail the job instead of going to code scanning.
          advanced-security: false
          online-audits: false
          persona: regular

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gitleaks over the full history (pinned in tools/go.mod)
        run: go tool -modfile=tools/go.mod gitleaks git --redact --no-banner --exit-code 1 .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  build:
    runs-on: ubuntu-latest
    needs: [go, golangci, web, licenses, generate, workflow-lint, secrets]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - name: Probe binary within size budget (ADR 0043, measured 21.6 MB)
        run: |
          set -euo pipefail
          make go-build-probe
          size="$(stat -c %s bin/pulsequorum-probe)"
          echo "pulsequorum-probe: $size bytes"
          [[ "$size" -lt 25000000 ]] || { echo "::error::bin/pulsequorum-probe is $size bytes, budget is 25000000"; exit 1; }
      - run: docker build -t pulsequorum:ci .
      - run: docker build -f Dockerfile.probe -t pulsequorum-probe:ci .

# SonarCloud project (.github/workflows/sonarcloud.yml).
sonar.projectKey=Joinsider_pulsequorum
sonar.organization=joinsider
sonar.projectName=pulsequorum

sonar.sources=cmd,internal,build,web/src
sonar.tests=cmd,internal,build,web/src
sonar.test.inclusions=**/*_test.go,**/*.spec.ts
sonar.exclusions=**/*_test.go,**/*.spec.ts,internal/api/gen/**,internal/api/unimplemented.go,internal/pb/**,internal/webui/dist/**,web/src/app/api/gen/**

# Go coverage from the workflow. The web has no coverage report yet (needs
# @vitest/coverage-v8), so it is left out of the coverage metric for now.
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=web/**,cmd/**/main.go
sonar.sourceEncoding=UTF-8

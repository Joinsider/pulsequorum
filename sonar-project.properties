# SonarCloud project (job sonarcloud in .github/workflows/ci.yml).
sonar.projectKey=Joinsider_pulsequorum
sonar.organization=joinsider
sonar.projectName=pulsequorum

# Generated code, test files and binary assets.
sonar.exclusions=**/*_test.go,**/*.spec.ts,internal/api/gen/**,internal/api/unimplemented.go,internal/pb/**,internal/store/sqlite/statedb/**,internal/store/sqlite/metricsdb/**,internal/webui/dist/**,web/src/app/api/gen/**,**/*.ico,**/*.png,**/*.jpg,**/*.woff,**/*.woff2

# The SQL files are SQLite migrations; the PL/SQL analyzer only knows Oracle and
# would check them with rules that do not apply. Limit it to Oracle package
# bodies, which this repository does not have.
sonar.plsql.file.suffixes=.pkb

# Coverage reports from the go and web jobs of ci.yml (go merges the profiles of
# the go-test shards, make go-test-shard; web runs make web-test).
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/pulsequorum-web/lcov.info
# sqlitetest and storetest are helpers for tests only; their error paths (failing temp dirs)
# are not worth tests of their own. spikes/ are throwaway prototypes, test/ and
# web/e2e/ are the chaos, load, acceptance and e2e harnesses that run against a
# live cluster, and build/release/main.go drives git and gh; CI collects no
# coverage for them. They are still analyzed for issues.
sonar.coverage.exclusions=cmd/**/main.go,build/release/main.go,web/src/main.ts,internal/store/sqlite/sqlitetest/**,internal/store/storetest/**,spikes/**,test/**,web/e2e/**
sonar.sourceEncoding=UTF-8

# Fail the sonarcloud job (a required check on master) when the quality gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

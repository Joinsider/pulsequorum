# GoReleaser v2 configuration (ADR 0009, ADR 0040).
# Validate locally: go run github.com/goreleaser/goreleaser/v2@v2.20.2 check
# Release: .github/workflows/release.yml on a signed tag v* (make release); the
# release notes come from the signed tag message (--release-notes).
version: 2

project_name: pulsequorum

before:
  hooks:
    - make web-embed
    - make web-stage
    - make notices

builds:
  - id: pulsequorum
    main: ./cmd/pulsequorum
    binary: pulsequorum
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/joinsider/pulsequorum/internal/version.Version={{.Version}}
      - -X github.com/joinsider/pulsequorum/internal/version.Commit={{.ShortCommit}}
      - -X github.com/joinsider/pulsequorum/internal/version.Date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
  # Probe-only binary without SPA, REST API, OIDC and Shoutrrr (ADR 0043).
  - id: pulsequorum-probe
    main: ./cmd/pulsequorum-probe
    binary: pulsequorum-probe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/joinsider/pulsequorum/internal/version.Version={{.Version}}
      - -X github.com/joinsider/pulsequorum/internal/version.Commit={{.ShortCommit}}
      - -X github.com/joinsider/pulsequorum/internal/version.Date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  # Config writer of the web image (ADR 0036 6B). Same flags and targets as the probe.
  # It reads FRONTEND_* and OIDC_* from the environment and writes config.json and the
  # nginx headers include; it serves nothing itself.
  - id: pulsequorum-webconfig
    main: ./cmd/pulsequorum-webconfig
    binary: pulsequorum-webconfig
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/joinsider/pulsequorum/internal/version.Version={{.Version}}
      - -X github.com/joinsider/pulsequorum/internal/version.Commit={{.ShortCommit}}
      - -X github.com/joinsider/pulsequorum/internal/version.Date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: pulsequorum
    ids:
      - pulsequorum
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - LICENSING.md
      - THIRD_PARTY_NOTICES.md

  - id: pulsequorum-probe
    ids:
      - pulsequorum-probe
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-probe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - LICENSING.md
      - THIRD_PARTY_NOTICES.md

  # Static SPA for any web server (ADR 0036, Option 6A). The image of the same name is
  # built from the same web-dist/ staging directory (Dockerfile.web.release).
  - id: pulsequorum-web
    meta: true
    formats:
      - tar.gz
    name_template: "pulsequorum-web_{{ .Version }}"
    files:
      # A single entry: matched directories (i18n/) are added recursively with
      # their path. Extra entries broke the archive: GoReleaser strips the longest
      # common prefix of a glob's matches, so "*/**/*" added i18n files a level too
      # high, and a single-file src uses dst as the file name, so
      # config.example.json became a file named pulsequorum-web and syft failed to
      # unpack the archive for the SBOM (v0.0.6). config.example.json is in the
      # build output already (web/public).
      - src: web/dist/pulsequorum-web/browser/*
        dst: pulsequorum-web
      - LICENSE
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

# SBOM per archive via syft (installed in the release workflow).
sboms:
  - id: archives
    artifacts: archive

dockers_v2:
  - id: pulsequorum
    ids:
      - pulsequorum
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/joinsider/pulsequorum
    tags:
      - "{{ .Version }}"
      - '{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}'
      # latest only from 1.0.0 on: 0.x may contain breaking changes (ADR 0040).
      - '{{ if and (not .Prerelease) (ge .Major 1) }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    # Copied into the build context; Dockerfile.release COPYs them to /licenses.
    extra_files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
    labels:
      org.opencontainers.image.title: pulsequorum
      org.opencontainers.image.source: https://github.com/Joinsider/pulsequorum
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: AGPL-3.0-only
  # Probe image (ADR 0043); same tag rules as the main image.
  - id: pulsequorum-probe
    ids:
      - pulsequorum-probe
    dockerfile: Dockerfile.probe.release
    images:
      - ghcr.io/joinsider/pulsequorum-probe
    tags:
      - "{{ .Version }}"
      - '{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if and (not .Prerelease) (ge .Major 1) }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    # Copied into the build context; Dockerfile.probe.release COPYs them to /licenses.
    extra_files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
    labels:
      org.opencontainers.image.title: pulsequorum-probe
      org.opencontainers.image.source: https://github.com/Joinsider/pulsequorum
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: AGPL-3.0-only

  # Web image (ADR 0036 6B): official nginx (UID 101) with the SPA, the webconfig writer and
  # the nginx configuration. Same tag rules as the other images.
  - id: pulsequorum-web
    ids:
      - pulsequorum-webconfig
    dockerfile: Dockerfile.web.release
    images:
      - ghcr.io/joinsider/pulsequorum-web
    tags:
      - "{{ .Version }}"
      - '{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if and (not .Prerelease) (ge .Major 1) }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    # Copied into the build context at the same relative paths that Dockerfile.web.release
    # uses: the staged SPA (make web-stage), the nginx configuration, the entrypoint
    # script, and the licenses.
    extra_files:
      - web-dist
      - deploy/web/nginx.conf
      - deploy/web/10-pulsequorum-webconfig.sh
      - LICENSE
      - THIRD_PARTY_NOTICES.md
    labels:
      org.opencontainers.image.title: pulsequorum-web
      org.opencontainers.image.source: https://github.com/Joinsider/pulsequorum
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: AGPL-3.0-only

# Explicit, so the config also validates without a git remote.
release:
  github:
    owner: Joinsider
    name: pulsequorum
  # The project owner reviews and publishes the draft; immutable releases lock
  # tag and assets on publish (ADR 0040).
  draft: true
  replace_existing_draft: true
  prerelease: auto
  name_template: "Pulsequorum {{ .Tag }}"

# cosign keyless (Sigstore): checksums.txt as a bundle, images by digest.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
      - '^ci'
      - '^Merge'
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Others
      order: 999

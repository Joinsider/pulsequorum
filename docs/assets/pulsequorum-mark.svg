<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <g id="pulsequorum-mark">
    <!-- Outer Quorum Ring (Dashed Cluster Connection) -->
    <circle cx="130" cy="130" r="82" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

    <!-- Cluster Nodes (5 Nodes in clean Pentagon arrangement for odd-numbered Raft Quorum) -->
    <!-- Top Node -->
    <g transform="translate(130, 48)">
      <circle cx="0" cy="0" r="13.5" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
      <circle cx="9" cy="-9" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Top-Right Node -->
    <g transform="translate(208, 105)">
      <circle cx="0" cy="0" r="13.5" fill="#dcfce7" stroke="#1e293b" stroke-width="3"/>
      <circle cx="9" cy="-9" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Bottom-Right Node -->
    <g transform="translate(178, 196)">
      <circle cx="0" cy="0" r="13.5" fill="#fef3c7" stroke="#1e293b" stroke-width="3"/>
      <circle cx="9" cy="-9" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Bottom-Left Node -->
    <g transform="translate(82, 196)">
      <circle cx="0" cy="0" r="13.5" fill="#e0f2fe" stroke="#1e293b" stroke-width="3"/>
      <circle cx="9" cy="-9" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Top-Left Node -->
    <g transform="translate(52, 105)">
      <circle cx="0" cy="0" r="13.5" fill="#dcfce7" stroke="#1e293b" stroke-width="3"/>
      <circle cx="9" cy="-9" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Cute Geometric Bot / Leader Core (Center at 130, 130) -->
    <g id="leader-bot">
      <!-- Antennas -->
      <line x1="115" y1="88" x2="110" y2="75" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="109" cy="73" r="4" fill="#0ea5e9" stroke="#1e293b" stroke-width="2.5"/>

      <line x1="145" y1="88" x2="150" y2="75" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="151" cy="73" r="4" fill="#10b981" stroke="#1e293b" stroke-width="2.5"/>

      <!-- Bot Side Pods -->
      <rect x="85" y="112" width="10" height="24" rx="5" fill="#94a3b8" stroke="#1e293b" stroke-width="3"/>
      <rect x="165" y="112" width="10" height="24" rx="5" fill="#94a3b8" stroke="#1e293b" stroke-width="3"/>

      <!-- Bot Head Shell -->
      <rect x="92" y="88" width="76" height="68" rx="22" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>

      <!-- Visor Screen -->
      <rect x="102" y="99" width="56" height="36" rx="12" fill="#1e293b"/>

      <!-- Happy Cute Eyes -->
      <path d="M 113 117 Q 118 110 123 117" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 137 117 Q 142 110 147 117" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Subtle Cheeks -->
      <circle cx="111" cy="124" r="2.5" fill="#f472b6" opacity="0.85"/>
      <circle cx="149" cy="124" r="2.5" fill="#f472b6" opacity="0.85"/>

      <!-- Heartbeat / Pulse Line Pill across lower body -->
      <rect x="80" y="138" width="100" height="26" rx="13" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
      <polyline points="90,151 108,151 115,141 124,160 133,137 141,155 147,151 170,151"
                fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

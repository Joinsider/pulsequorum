# Pulsequorum Probe (Pflichtenheft FA-PRB-01 bis FA-PRB-07, ADR 0034, hardening ADR 0044).
# Start from the repository root:  docker compose -f deploy/probe/compose.yaml up -d
# Guide: docs/betrieb/probe.md
#
# All variables below are read by internal/config/config.go. Unset variables
# use the defaults documented there; the commented ones are optional.
services:
  probe:
    image: ghcr.io/joinsider/pulsequorum:0.0
    build:
      context: ../..
    restart: unless-stopped
    environment:
      NODE_ROLE: probe
      NODE_NAME: probe-eu-1
      NODE_REGION: eu-central
      # Optional key=value labels (comma-separated):
      # NODE_LABELS: provider=hetzner,tier=edge
      # Address(es) of cluster voter gRPC ports (comma-separated host:port or https://host:port):
      CLUSTER_SEEDS: voter1.example.com:9443,voter2.example.com:9443
      # Preferred: pass the one-time probe join token via a Compose secret file.
      # For quick tests you can also set CLUSTER_JOIN_TOKEN (or JOIN_TOKEN) instead of JOIN_TOKEN_FILE.
      JOIN_TOKEN_FILE: /run/secrets/join_token
      # CLUSTER_JOIN_TOKEN: ""
      # Local SQLite heartbeat buffer settings (ADR 0034):
      PROBE_BUFFER_MAX_AGE: 24h
      PROBE_BUFFER_MAX_BYTES: 100MiB
      PROBE_ACK_RETAIN: 10m
      # Session idle timeout after missing voter ticks (keepalive = 30s, tick = 5s):
      PROBE_SESSION_TIMEOUT: 15s
      # Local policy of the probe (ADR 0044, docs/betrieb/probe.md, section "Lokale Richtlinie der Probe").
      # REQUIRED for private probes (probe joined with a tenant certificate): without this
      # variable the probe exits with an error after joining and keeps its certificate.
      # Comma-separated IP/CIDR entries, optional :port or :from-to, IPv6 with port in brackets.
      # The value below is a PLACEHOLDER: replace it with the networks this probe may reach.
      # "any" disables the target restriction on purpose. A public probe that should check
      # public targets freely must not set this variable.
      PROBE_ALLOW_TARGETS: "10.20.0.0/16:443"
      # PROBE_ALLOW_HTTP_METHODS: "GET,HEAD"   # default for private probes: GET,HEAD; public probes: all; or "any"
      # PROBE_ALLOW_MONITOR_TYPES: "http,tcp,icmp,dns"  # default: all monitor types
      # PROBE_RESULT_DETAIL: full              # full (default) | minimal (fewer values and addresses reported)
      # Health/Metrics listener & logging:
      # HTTP_ADDR: ":8080"       # serves /healthz and /readyz only (no API/UI in probe role)
      # METRICS_ADDR: ":9090"    # optional Prometheus /metrics endpoint
      # METRICS_TOKEN_FILE: /run/secrets/metrics_token
      # LOG_LEVEL: info          # debug | info | warn | error
      LOG_FORMAT: json           # json | text
      # ICMP_MODE: auto          # auto | privileged | unprivileged | off (docs/betrieb/icmp.md)
      # SSRF_PROTECTION: auto    # auto | on | off
    # Read-only root filesystem (ADR 0044). Writable paths: /data (volume below) and /tmp (tmpfs).
    read_only: true
    tmpfs:
      - /tmp
    # The probe needs no Linux capabilities: ICMP runs over unprivileged ping sockets (see sysctls).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      # Holds node.id, node.crt/key, ca-bundle.pem, voters.json, and metrics.db buffer.
      - probe-data:/data
    secrets:
      - join_token
    # A probe initiates all connections outbound to voters; no inbound cluster or UI ports needed.
    # Minimal resource footprint target (NFA-PERF-02: < 64 MiB RSS):
    mem_limit: 128m
    # ICMP without extra capabilities: allow unprivileged ping sockets for uid/gid 65532.
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"
    healthcheck:
      test: ["CMD", "/pulsequorum", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# Generate a join token with role "probe" via Admin API:
#   POST /api/v1/admin/join-tokens  {"role":"probe"}
# Store it once before first start:
#   mkdir -p secrets && printf '%s\n' '<TOKEN>' > secrets/join_token && chmod 600 secrets/join_token
secrets:
  join_token:
    file: ./secrets/join_token

volumes:
  probe-data:

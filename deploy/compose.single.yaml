# Single voter, local users (Pflichtenheft Kap. 3, Konzept 16.1).
# Start from the repository root:  docker compose -f deploy/compose.single.yaml up --build
# Anleitung: docs/betrieb/compose.md
#
# All variables below are read by internal/config/config.go. Unset variables
# use the defaults documented there; the commented ones are optional.
services:
  uptime:
    image: ghcr.io/joinsider/pulsequorum:latest
    build:
      context: ..
    restart: unless-stopped
    environment:
      NODE_NAME: vps1
      NODE_ROLE: voter
      AUTH_MODE: local
      # Public URL under which users reach the UI (scheme and host, no path).
      # Needed behind a reverse proxy; also allowed as CORS origin.
      # PUBLIC_URL: https://mon1.example.com
      # Additional origins of external frontends (comma-separated, no paths).
      # CORS_ORIGINS: https://status.example.com
      # Master key (ADR 0011). Without it, the node generates DATA_DIR/master.key.
      # Recommended: an external key from a Compose secret (see below).
      # MASTER_KEY_FILE: /run/secrets/master_key
      # LOG_LEVEL: info          # debug | info | warn | error
      LOG_FORMAT: json           # json | text
      # ICMP_MODE: auto          # auto | privileged | unprivileged | off (docs/betrieb/icmp.md)
      # SSRF_PROTECTION: auto    # auto | on | off; auto is off in local mode
      # RAW_COMPACTION: "true"   # compact heartbeats older than 48 h
      # RETENTION_RAW_DAYS: "30"       # minimum 3
      # RETENTION_HOURLY_DAYS: "365"   # minimum 1
      # RETENTION_DAILY_DAYS: "0"      # 0 = keep forever
      # ALERT_MAX_ATTEMPTS: "10"       # 1 to 100 delivery attempts per alert and channel
      # SELF_CHECK_TARGETS: "1.1.1.1:443,https://example.com"  # 2 to 3 independent targets; empty = off
      # SELF_HEALTH_FAIL_RATIO: "0.5"  # share of failed checks at which a node counts as impaired, 0 to 1
      # DEGRADED_AFTER: 15s            # time without a known leader before alerts are sent unconfirmed; 0 = off
      # SHUTDOWN_TIMEOUT: 10s
    volumes:
      # The image runs as nonroot (uid 65532); a named volume is writable out of the box.
      # Holds state.db, metrics.db, node ID and (by default) master.key.
      - uptime-data:/data
    # secrets:
    #   - master_key               # uncomment together with MASTER_KEY_FILE above
    ports:
      - "8080:8080" # API + UI; behind a reverse proxy use "127.0.0.1:8080:8080"
      # - "9443:9443" # cluster port, only needed when more voters join
    # ICMP without extra capabilities: allow the image's group (65532) to open
    # unprivileged ICMP sockets. Details: docs/betrieb/icmp.md
    sysctls:
      net.ipv4.ping_group_range: "65532 65532"
    # Explicit healthcheck, so it also works with Podman (OCI images drop the
    # Dockerfile HEALTHCHECK). Same command as the image default.
    healthcheck:
      test: ["CMD", "/pulsequorum", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# Optional external master key (recommended, ADR 0011). Create it once outside
# the repository and keep a backup:
#   mkdir -p secrets && openssl rand -base64 32 > secrets/master.key && chmod 600 secrets/master.key
# secrets:
#   master_key:
#     file: ./secrets/master.key

volumes:
  uptime-data:

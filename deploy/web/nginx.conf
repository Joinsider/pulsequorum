# nginx main configuration for the Pulsequorum web image (ADR 0036, 6B).
#
# Base image: official nginx on Alpine, run as UID 101 (listens on 8080).
# The root filesystem may be read-only: pid and all temp paths live under
# /tmp/pulsequorum, which the container provides as a tmpfs. The entrypoint
# script 10-pulsequorum-webconfig.sh creates that directory and writes the
# generated config.json and headers.conf before nginx starts.
#
# nginx serves static files only. Requests under /api/ are answered with 404
# and never proxied (the SPA talks to the voters directly, ADR 0036).

worker_processes auto;
pid /tmp/pulsequorum/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/pulsequorum/client_body;
    proxy_temp_path /tmp/pulsequorum/proxy;
    fastcgi_temp_path /tmp/pulsequorum/fastcgi;
    uwsgi_temp_path /tmp/pulsequorum/uwsgi;
    scgi_temp_path /tmp/pulsequorum/scgi;

    access_log /dev/stdout;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Container healthcheck. Deliberately without security headers.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # The SPA shell and the runtime configuration are never cached, so that
        # a new release or a changed node list takes effect on the next load.
        # add_header in a nested location replaces the inherited ones, so every
        # location that sets a header also includes the security headers.
        location = / {
            add_header Cache-Control "no-store" always;
            include /tmp/pulsequorum/headers.conf;
            try_files /index.html =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            include /tmp/pulsequorum/headers.conf;
        }

        # Runtime configuration written by pulsequorum-webconfig (not in the
        # read-only root filesystem).
        location = /config.json {
            alias /tmp/pulsequorum/web/config.json;
            add_header Cache-Control "no-store" always;
            include /tmp/pulsequorum/headers.conf;
        }

        # Hashed bundles from the Angular build (for example main-ABCDEFGH.js)
        # never change under the same name and may be cached for a year.
        location ~* "-[A-Z0-9]{8}\.(js|css|woff2?)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /tmp/pulsequorum/headers.conf;
            try_files $uri =404;
        }

        # Everything else: static files, with the SPA fallback to index.html.
        location / {
            include /tmp/pulsequorum/headers.conf;
            try_files $uri $uri/ /index.html;
        }

        # Never proxy the API. A request that reaches the web image under
        # /api/ is a misconfiguration of the reverse proxy or of the node list.
        location /api/ {
            return 404;
        }
    }
}

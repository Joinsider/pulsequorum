# golangci-lint v2 configuration (see docs/adr/0009-ci-cd-und-release.md).
# Pinned version: v2.15.0 (Makefile target `golangci`, CI job `go`).
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - usestdlibvars
  exclusions:
    generated: lax
    rules:
      # Test harnesses (load generator, chaos runner) start podman/iptables,
      # read result files given on the command line and use math/rand for
      # jitter and test data; these gosec rules do not apply there.
      - path: ^test/
        linters:
          - gosec
        text: "G(115|204|304|401|404)"
    paths:
      - internal/api/gen
      - internal/pb
      - internal/store/sqlite/statedb
      - internal/store/sqlite/metricsdb
      - internal/api/unimplemented.go
      - web
      - spikes
      - tools
      - third_party$
      - builtin$
      - examples$

# golangci-lint v2 configuration (see docs/adr/0009-ci-cd-und-release.md).
# Pinned version: v2.15.0 (Makefile target `golangci`, CI job `go`).
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - usestdlibvars
  exclusions:
    generated: lax
    paths:
      - internal/api/gen
      - internal/pb
      - internal/api/unimplemented.go
      - web
      - spikes
      - tools
      - third_party$
      - builtin$
      - examples$

syntax = "proto3";

package uptimecluster.v1;

import "uptimecluster/v1/heartbeat.proto";

option go_package = "github.com/joinsider/uptimecluster/internal/pb/uptimecluster/v1;uptimeclusterv1";

// Command is the envelope of every Raft log entry (ADR 0005). The leader fills
// issued_at_ms and all new IDs before proposing, so FSM.Apply never reads the
// clock or a random source (FA-CLU-07).
//
// Draft: the payload set is refined together with the schema in AP-1.2.
message Command {
  // Command format version; new versions are only proposed once every voter
  // supports them (feature gate, FA-CLU-12).
  uint32 version = 1;
  // Client request ID (Idempotency-Key) used for deduplication (FA-CLU-06).
  string request_id = 2;
  // Leader wall-clock time when the command was proposed, UTC milliseconds.
  int64 issued_at_ms = 3;
  Actor actor = 4;
  // Empty for platform-level commands.
  string tenant_id = 5;

  // 13 and 14 were OpenIncident and ResolveIncident; incidents are part of
  // SetMonitorState so that status and incident change atomically.
  reserved 13, 14;

  oneof payload {
    PutEntity put_entity = 10;
    DeleteEntity delete_entity = 11;
    SetMonitorState set_monitor_state = 12;
    EnqueueAlert enqueue_alert = 15;
    AckAlertDelivery ack_alert_delivery = 16;
    RegisterNode register_node = 17;
    SetFeatureLevel set_feature_level = 18;
    CreateSession create_session = 19;
    RotateSession rotate_session = 20;
    RevokeSessions revoke_sessions = 21;
    RedeemJoinToken redeem_join_token = 22;
    RevokeCertificate revoke_certificate = 23;
    RevokeNode revoke_node = 24;
    SetNodeHealth set_node_health = 25;
    SetNodeConnectivity set_node_connectivity = 26;
    ClearMonitorFlapping clear_monitor_flapping = 27;
    ReportDegradedAlerts report_degraded_alerts = 28;
    ResolveUnconfirmedAlerts resolve_unconfirmed_alerts = 29;
    RecordMonitorHistory record_monitor_history = 30;
    SetSystemAlert set_system_alert = 31;
    RecordIncarnation record_incarnation = 32;
    Checkpoint checkpoint = 33;
    BindTenantOrg bind_tenant_org = 34;
  }
}

// Actor is who caused a command (audit log, FA-DAT-01).
message Actor {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_USER = 1;
    KIND_API_TOKEN = 2;
    KIND_SYSTEM = 3;
  }
  Kind kind = 1;
  string id = 2;
}

// Kinds of tenant-scoped configuration objects stored as JSON documents.
enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_MONITOR = 1;
  ENTITY_KIND_NOTIFICATION_CHANNEL = 2;
  ENTITY_KIND_MAINTENANCE_WINDOW = 3;
  ENTITY_KIND_USER = 4;
  ENTITY_KIND_TENANT = 5;
  ENTITY_KIND_JOIN_TOKEN = 6;
  ENTITY_KIND_SECRET_KEY = 7;
  ENTITY_KIND_SIGNING_KEY = 8;
  // Cluster CA (ADR 0006); the ID is the CA fingerprint, the key is encrypted (ADR 0011).
  ENTITY_KIND_CLUSTER_CA = 9;
}

// PutEntity creates or replaces a configuration object. Secrets inside the
// document are already encrypted by the leader (ADR 0011).
message PutEntity {
  EntityKind kind = 1;
  string id = 2;
  bytes document_json = 3;
  // Optimistic concurrency: 0 = create, otherwise the revision being replaced.
  uint64 expected_revision = 4;
}

// DeleteEntity removes a configuration object.
message DeleteEntity {
  EntityKind kind = 1;
  string id = 2;
}

// SetMonitorState records a consensus status change (FA-CON-06). The FSM
// keeps incidents consistent with it (FA-INC-01): a change to DOWN opens an
// incident, leaving DOWN resolves it at since_ms.
message SetMonitorState {
  string monitor_id = 1;
  // MonitorStatus as defined in the REST API (UP, DOWN, …). PAUSED is set
  // only by pausing the monitor.
  string status = 2;
  // false if raised without quorum (degraded mode, FA-ALR-10).
  bool confirmed = 3;
  int64 since_ms = 4;
  // Status the decision was based on. The FSM rejects the command with a
  // conflict if the stored status differs, e.g. after a pause.
  string expected_status = 5;
  // Required for a change to DOWN: the incident to open.
  IncidentStart incident = 6;
  // Node IDs that reported in the deciding slot, set by the leader (FA-ALR-11).
  // Empty below command level 5.
  repeated string reporters = 7;
  // Node that proposed the change.
  string sender_node_id = 8;
}

// IncidentStart describes the cause of an incident.
message IncidentStart {
  string incident_id = 1;
  string cause = 2;
  ErrorClass error_class = 3;
  repeated string affected_node_ids = 4;
}

// EnqueueAlert repeats the DOWN alert of a monitor while it stays DOWN
// (resendIntervalMinutes, FA-ALR-02). The FSM builds the payload and applies
// it only if the monitor is still in the same DOWN period.
message EnqueueAlert {
  // 1–3 were a leader-built key, channel list and payload (draft).
  reserved 1, 2, 3;
  string monitor_id = 4;
  // since_ms of the DOWN state the reminder belongs to.
  int64 down_since_ms = 5;
  // Number of the reminder within this DOWN period, starting at 1.
  uint32 reminder = 6;
}

// AckAlertDelivery records the outcome of a delivery attempt (ADR 0014).
message AckAlertDelivery {
  string alert_key = 1;
  string channel_id = 2;
  bool delivered = 3;
  // Permanent failures disable the channel (FA-ALR-05).
  bool permanent_failure = 4;
  // Error message, already cleaned of secrets.
  string error = 5;
  // Next attempt after a temporary failure; the leader adds the jitter.
  int64 next_attempt_ms = 6;
  // Number of this attempt (1-based); acks for other attempts are ignored.
  uint32 attempt = 7;
  // true if this was the last allowed attempt (ALERT_MAX_ATTEMPTS).
  bool give_up = 8;
}

// CreateSession starts a refresh token family after a successful login or
// setup (ADR 0008). Only the token hash is replicated. Records the login time.
message CreateSession {
  string user_id = 1;
  string token_hash = 2;
  string family_id = 3;
  int64 expires_ms = 4;
}

// RotateSession exchanges a refresh token for a new one (FA-AUTH-03). Using a
// token twice revokes its whole family; the result says which case applied.
message RotateSession {
  string old_token_hash = 1;
  string new_token_hash = 2;
  int64 expires_ms = 3;
}

// RevokeSessions revokes one token family (logout) or all sessions of a user
// (password change, disabling).
message RevokeSessions {
  string family_id = 1;
  string user_id = 2;
}

// RegisterNode adds or updates a node in the cluster registry.
message RegisterNode {
  NodeInfo node = 1;
}

// SetNodeHealth records a health change of a registered node (ADR 0017). Only
// the leader proposes it, from its Raft contact with the node.
message SetNodeHealth {
  string node_id = 1;
  bool healthy = 2;
}

// SetNodeConnectivity records a change of the connectivity of a node (ADR 0022).
// Only the leader proposes it, and only on a change. reason is "reference" or
// "deviation" while impaired is true, and empty otherwise.
message SetNodeConnectivity {
  string node_id = 1;
  bool impaired = 2;
  string reason = 3;
}

// SetFeatureLevel raises the command version the cluster may use (FA-CLU-12).
message SetFeatureLevel {
  uint32 level = 1;
}

// ClearMonitorFlapping ends a flapping period of a monitor (FA-ALR-06, ADR 0023).
// The leader proposes it after a quiet period. The FSM clears the period only if
// it still is the one the leader saw (expected_since_ms), otherwise it rejects
// the command as a conflict.
message ClearMonitorFlapping {
  string monitor_id = 1;
  int64 expected_since_ms = 2;
}

// NodeInfo describes a voter or probe.
message NodeInfo {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_VOTER = 1;
    ROLE_PROBE = 2;
  }
  string id = 1;
  string name = 2;
  Role role = 3;
  string incarnation = 4;
  // Stable cluster address (DNS:port), never derived from the IP (FA-CLU-10).
  string advertise_addr = 5;
  string region = 6;
  map<string, string> labels = 7;
  // Capabilities such as "icmp", "ipv6" (FA-CHK-31).
  repeated string capabilities = 8;
  // Empty for public probes.
  string owner_tenant_id = 9;
  string version = 10;
  // Highest Command.version this node can apply.
  uint32 max_command_version = 11;
}

// RedeemJoinToken uses up a join token (FA-PKI-02). The leader checks the
// presented secret in constant time and proposes its hash; the FSM accepts
// it once, before the token expires at command time, and only if the hash
// matches the stored one.
message RedeemJoinToken {
  string token_id = 1;
  // Hex SHA-256 as computed by pki.HashSecret.
  string secret_hash = 2;
  // Node the certificate will be issued to.
  string node_id = 3;
}

// RevokeCertificate adds a node certificate to the revocation list
// (FA-PKI-04). Entries are pruned once the certificate has expired.
message RevokeCertificate {
  // Serial in lower-case hex (pki.SerialString).
  string serial = 1;
  string node_id = 2;
  // NotAfter of the certificate, UTC milliseconds.
  int64 not_after_ms = 3;
}

// RevokeNode rejects every certificate of a node issued before the command
// time (FA-PKI-04): a removed node can no longer connect, while a later
// re-join with a new token gets a certificate that is valid again.
message RevokeNode {
  string node_id = 1;
}

// ReportDegradedAlerts stores the alerts a node sent while it was degraded
// (FA-ALR-10, ADR 0024). The node sends them after the quorum returned, in
// blocks of at most 100 entries. The FSM stores them idempotently by
// (node_id, local_id) in unconfirmed_alerts.
message ReportDegradedAlerts {
  string node_id = 1;
  repeated DegradedAlertEntry entries = 2;
}

// DegradedAlertEntry is one alert of the local degraded log of a node.
message DegradedAlertEntry {
  // ID in the local log of the reporting node; unique per node.
  int64 local_id = 1;
  string tenant_id = 2;
  string monitor_id = 3;
  string channel_id = 4;
  // Status announced by the alert (DOWN or UP).
  string status = 5;
  int64 since_ms = 6;
  // Time the node sent the alert, UTC milliseconds.
  int64 sent_ms = 7;
  // "sent", "failed" or "suppressed".
  string outcome = 8;
  // Voters the node could reach, and voters in total, when it sent the alert.
  int32 reachable = 9;
  int32 total = 10;
  // Node IDs of the partition that reported the change.
  repeated string reporters = 11;
}

// ResolveUnconfirmedAlerts stores the verdicts of the leader on unconfirmed
// alerts after the quorum returned (FA-ALR-10, ADR 0024). The FSM applies only
// open entries and creates outbox entries for them, depending on the verdict.
message ResolveUnconfirmedAlerts {
  repeated UnconfirmedVerdict verdicts = 1;
}

// UnconfirmedVerdict is the judgement of one unconfirmed alert.
message UnconfirmedVerdict {
  string node_id = 1;
  int64 local_id = 2;
  // "confirmed", "false_alarm" or "unverifiable".
  string verdict = 3;
  // Whether the FSM sends a notification for this verdict. Decided by the
  // leader, which knows whether the channel already received a confirmed alert.
  bool notify = 4;
}

// RecordMonitorHistory replaces the consensus status history of a monitor in
// [from_ms, to_ms) after a gap was re-evaluated (FA-UPT-07, ADR 0024). The FSM
// closes the gap with incidents marked as reevaluated and sends no alerts.
// The tenant is set by Command.tenant_id.
message RecordMonitorHistory {
  string monitor_id = 1;
  // Status the leader saw before the gap; the FSM rejects the command with a
  // conflict if the stored status differs.
  string expected_status = 2;
  int64 from_ms = 3;
  int64 to_ms = 4;
  repeated HistoryEntry entries = 5;
}

// HistoryEntry is one status change of a re-evaluated gap.
message HistoryEntry {
  int64 since_ms = 1;
  string status = 2;
  // Required for DOWN entries: the incident the period belongs to.
  string incident_id = 3;
  string cause = 4;
  string error_class = 5;
}

// SetSystemAlert records a change of a system alert (FA-OBS-01, ADR 0025). Only
// the leader proposes it, and only on a change. The FSM stores the alert and
// enqueues it for the channels of the system tenant that subscribe to "system".
// details_json is a JSON object with measured values and node IDs only.
message SetSystemAlert {
  // Kind of the alert, e.g. "replication_lag" (ADR 0025, section 3).
  string kind = 1;
  // Subject of the alert: a node ID, a certificate name or "cluster".
  string subject = 2;
  // true when the alert starts or continues, false when it clears.
  bool active = 3;
  // Level of the alert, e.g. the expiry stage of a certificate; 0 if unused.
  int32 level = 4;
  // JSON object with the details; empty means "{}".
  bytes details_json = 5;
}

// RecordIncarnation stores the incarnation a node reported (FA-REP-06, ADR 0025).
// It is the last known incarnation of the node; a change is detected by the leader.
message RecordIncarnation {
  string node_id = 1;
  string incarnation = 2;
}

// Checkpoint asks every replica to compute the fingerprint of its state at this
// log index (FA-CLU-07, ADR 0025). It changes no replicated data; each replica
// keeps the result in memory only.
message Checkpoint {}

// BindTenantOrg binds a tenant to an identity-provider organization (ADR 0027).
// The FSM sets tenants.zitadel_org_id; an org ID belongs to at most one tenant.
// A bound tenant is rebound only through the tenant admin API (ADR 0027).
message BindTenantOrg {
  string tenant_id = 1;
  string org_id = 2;
}

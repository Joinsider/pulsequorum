syntax = "proto3";

package uptimecluster.v1;

import "uptimecluster/v1/command.proto";

option go_package = "github.com/joinsider/uptimecluster/internal/pb/uptimecluster/v1;uptimeclusterv1";

// ClusterService runs on the cluster port of every voter (ALPN h2, ADR 0006).
service ClusterService {
  // Join enrolls a new voter or probe with a one-time join token. The caller
  // has already verified the server certificate against the CA fingerprint
  // embedded in the token (FA-PKI-02); Join is the only RPC that does not
  // require a client certificate.
  rpc Join(JoinRequest) returns (JoinResponse);

  // RenewCertificate issues a new node certificate before expiry (FA-PKI-03).
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);

  // Apply runs a command on the leader for a follower that forwards it
  // (FA-CLU-05). A follower returns FAILED_PRECONDITION and never forwards
  // again, so forwarding cannot loop.
  rpc Apply(ApplyRequest) returns (ApplyResponse);

  // GetStatus reports the callee's Raft and replication state. The leader uses
  // it to decide when a nonvoter may be promoted (ADR 0012 A3); health and the
  // admin UI use it to show replication lag (ADR 0012 A9).
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // RemoveNode removes a member on the leader for a follower that forwards a
  // platform admin's request (FA-CLU-08). Voters only: a voter is a full member
  // and could change the configuration itself. The follower has authorized the
  // admin; requested_by is for the log only. A follower returns
  // FAILED_PRECONDITION and never forwards again.
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
}

message JoinRequest {
  // Token ID and secret from "uc1.<token-id>.<secret>.<ca-fingerprint>".
  string token_id = 1;
  string token_secret = 2;
  NodeInfo node = 3;
  // PKCS#10 certificate signing request (DER); the private key never leaves the node.
  bytes csr_der = 4;
}

message JoinResponse {
  string cluster_id = 1;
  // Leaf certificate chain (DER), leaf first.
  repeated bytes certificate_chain_der = 2;
  // Trusted CA certificates (DER); more than one during CA rotation.
  repeated bytes ca_bundle_der = 3;
  // Current voters to connect to.
  repeated NodeInfo voters = 4;
  // Master key (KEK) for voters when no external key is configured (ADR 0011,
  // option B). Empty for probes and when MASTER_KEY_FILE is used.
  bytes kek = 5;
  // Fingerprint of the cluster KEK, so a voter with an external key can
  // verify it uses the same one.
  string kek_fingerprint = 6;
}

message RenewCertificateRequest {
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  repeated bytes certificate_chain_der = 1;
  repeated bytes ca_bundle_der = 2;
}

message ApplyRequest {
  Command command = 1;
}

message ApplyResponse {
  // Raft index at which the command was committed.
  uint64 index = 1;
  // Command-specific result (e.g. the created object) as JSON.
  bytes result_json = 2;
  // true if the request ID had already been applied (deduplicated retry).
  bool duplicate = 3;
  // Set if the command was deterministically rejected (the leader's
  // cluster.CommandError): the code is stable, the message is for humans.
  // The rejection is a result, not a gRPC error, so the caller can map it.
  string error_code = 4;
  string error_message = 5;
}

message GetStatusRequest {}

message GetStatusResponse {
  string node_id = 1;
  // Raft state: "Leader", "Follower", "Candidate" or "Shutdown".
  string raft_state = 2;
  // Highest log index applied to the FSM (state.db).
  uint64 applied_index = 3;
  // Highest log index known to be committed.
  uint64 commit_index = 4;
  uint64 last_log_index = 5;
  // Time since the last contact with the leader in milliseconds; 0 on the leader.
  int64 last_contact_ms = 6;
  // Node ID of the current leader as seen by the callee; empty without leader.
  string leader_id = 7;
  // Cluster address of the current leader; empty without leader. The admin
  // CLI sends its commands there (ADR 0019).
  string leader_address = 8;
  // Wall clock of the callee in Unix milliseconds when it answered (ADR 0020).
  // Callers estimate the clock offset from it.
  int64 wall_clock_unix_ms = 9;
}

message RemoveNodeRequest {
  string node_id = 1;
  // User ID of the platform admin who asked, for the leader's log.
  string requested_by = 2;
}

message RemoveNodeResponse {
  // Voters left after the removal.
  int32 voters_left = 1;
  // Quorum warning (FA-CLU-11); empty when none applies.
  string warning = 2;
  // Deterministic rejection: "unknown_node", "remove_leader" or "last_voter";
  // empty on success.
  string error_code = 3;
  string error_message = 4;
}

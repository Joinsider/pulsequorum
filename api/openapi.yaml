# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (C) 2026 The Pulsequorum Authors
#
# REST contract between backend and frontend (ADR 0003). Spec-first: change this
# file, then run `make generate`. Scope: all phase-1 endpoints (single voter).
openapi: 3.0.3
info:
  title: Pulsequorum API
  version: 0.1.0
  description: |
    REST API of an Pulsequorum voter. Every voter answers every request;
    writes are forwarded to the Raft leader internally.

    The tenant is always derived from the access token, never from URL or body.
    Errors use RFC 9457 problem details (`application/problem+json`).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
    description: Node status
  - name: auth
    description: Login, tokens and the current user (local mode)
  - name: users
    description: Local users of the tenant
  - name: monitors
    description: Monitors, heartbeats and uptime
  - name: notifications
    description: Notification channels (Shoutrrr, webhook)
  - name: maintenance
    description: Maintenance windows
  - name: incidents
    description: Incidents
  - name: stream
    description: Live updates over WebSocket
  - name: cluster
    description: Cluster administration (platform admins only, FA-CLU-08)
  - name: system-admin
    description: System channels and system alerts (platform admins only, ADR 0025)
  - name: tenant-admin
    description: Tenants and plans (platform admins only, ADR 0029)
  - name: tenant
    description: The caller's own tenant, its limits and usage (ADR 0029)
  - name: api-tokens
    description: API tokens of the tenant (interactive logins only, ADR 0031)
  - name: audit
    description: Audit log of the tenant (ADR 0031)

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Public node status
      security: []
      responses:
        "200":
          description: Node status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  # --- Auth (local mode, ADR 0008) ------------------------------------------
  /auth/setup:
    post:
      tags: [auth]
      operationId: setup
      summary: Create the first platform admin using the one-time setup token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Admin created and logged in
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh cookie and issue a new access token
      description: "Requires the refresh cookie and the header `X-Requested-With: pulsequorum`."
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      responses:
        "200":
          description: New access token
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the refresh token family and clear the cookie
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      responses:
        "204": { description: Logged out }
        "400": { $ref: "#/components/responses/BadRequest" }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Get the current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/password:
    put:
      tags: [auth]
      operationId: changeMyPassword
      summary: Change my password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed; other sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Users (local mode) ----------------------------------------------------
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: Users of the tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      operationId: updateUser
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete user
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Monitors ----------------------------------------------------------------
  /monitor-types:
    get:
      tags: [monitors]
      operationId: listMonitorTypes
      summary: Available checker plugins with their JSON schema
      responses:
        "200":
          description: Monitor types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MonitorType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /monitors:
    get:
      tags: [monitors]
      operationId: listMonitors
      summary: List monitors
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: tag
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MonitorStatus" }
        - name: q
          in: query
          description: Case-insensitive search in name and target
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Monitors including their current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [monitors]
      operationId: createMonitor
      summary: Create monitor
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /monitors/bulk:
    post:
      tags: [monitors]
      operationId: bulkMonitors
      summary: Apply one action to several monitors
      description: |
        Atomic: either all listed monitors change or none does (ADR 0031). Each
        monitor must belong to the caller's tenant; an unknown or duplicate ID is
        a 422 that names its position in `ids`. `addTags` and `removeTags` apply
        the same rules as a single update (at most 20 tags, 1 to 64 characters).
        Monitors that already are in the requested state (paused, resumed, tag
        present or absent) are left unchanged and report their current revision.
        A monitor that changed concurrently answers 409 and nothing is applied.
        Every monitor gets its own audit entry; all share the request ID.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkMonitorsInput" }
      responses:
        "200":
          description: Results in the order of `ids`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkMonitorsResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /monitors/{monitorId}:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      tags: [monitors]
      operationId: getMonitor
      summary: Get monitor
      responses:
        "200":
          description: Monitor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [monitors]
      operationId: updateMonitor
      summary: Update monitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [monitors]
      operationId: deleteMonitor
      summary: Delete monitor
      responses:
        "204": { description: Deleted; measurement data is removed asynchronously }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /monitors/{monitorId}/pause:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      tags: [monitors]
      operationId: pauseMonitor
      summary: Pause monitor
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /monitors/{monitorId}/resume:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      tags: [monitors]
      operationId: resumeMonitor
      summary: Resume monitor
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /monitors/{monitorId}/clone:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      tags: [monitors]
      operationId: cloneMonitor
      summary: Clone monitor
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Clone (paused, name suffixed with " (copy)")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /monitors/{monitorId}/test:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    post:
      tags: [monitors]
      operationId: testMonitor
      summary: Run the check once now without storing the result
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /monitors/{monitorId}/heartbeats:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      tags: [monitors]
      operationId: listHeartbeats
      summary: List heartbeats
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/NodeFilter"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: Heartbeats ordered by time ascending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartbeatPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /monitors/{monitorId}/uptime:
    parameters:
      - $ref: "#/components/parameters/MonitorId"
    get:
      tags: [monitors]
      operationId: getUptime
      summary: Get uptime
      parameters:
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 30d, 365d]
        - $ref: "#/components/parameters/NodeFilter"
      responses:
        "200":
          description: Uptime statistics computed from rollups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UptimeStats" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Notifications -----------------------------------------------------------
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      summary: List notification channels
      responses:
        "200":
          description: Channels (secrets masked)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      summary: Create notification channel
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [notifications]
      operationId: getNotificationChannel
      summary: Get notification channel
      responses:
        "200":
          description: Channel (secrets masked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [notifications]
      operationId: updateNotificationChannel
      summary: Update notification channel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      summary: Delete notification channel
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/{channelId}/test:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: Send a test message synchronously
      responses:
        "200":
          description: Delivery result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Maintenance -------------------------------------------------------------
  /maintenance:
    get:
      tags: [maintenance]
      operationId: listMaintenanceWindows
      summary: List maintenance windows
      responses:
        "200":
          description: Maintenance windows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceWindow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [maintenance]
      operationId: createMaintenanceWindow
      summary: Create maintenance window
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceWindowInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceWindow" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /maintenance/{maintenanceId}:
    parameters:
      - $ref: "#/components/parameters/MaintenanceId"
    get:
      tags: [maintenance]
      operationId: getMaintenanceWindow
      summary: Get maintenance window
      responses:
        "200":
          description: Maintenance window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceWindow" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [maintenance]
      operationId: updateMaintenanceWindow
      summary: Update maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceWindowInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceWindow" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [maintenance]
      operationId: deleteMaintenanceWindow
      summary: Delete maintenance window
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Incidents ---------------------------------------------------------------
  /incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: List incidents
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: monitorId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: open
          in: query
          description: Only unresolved incidents
          schema: { type: boolean }
      responses:
        "200":
          description: Incidents, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /incidents/{incidentId}:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [incidents]
      operationId: getIncident
      summary: Get incident
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- API tokens (FA-AUTH-10, ADR 0031) ----------------------------------------
  /api-tokens:
    get:
      tags: [api-tokens]
      operationId: listApiTokens
      summary: List the API tokens of the tenant
      description: |
        Tenant admins and platform admins, with an interactive login only (API
        tokens cannot manage API tokens). Newest first. Neither the secret nor its
        hash is ever shown.
      responses:
        "200":
          description: API tokens of the tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [api-tokens]
      operationId: createApiToken
      summary: Create an API token
      description: |
        Tenant admins and platform admins, with an interactive login only. The
        secret is returned exactly once in `token` (sent with Cache-Control
        no-store) and is never stored or shown again; only its SHA-256 is kept.
        Retrying a request creates another token, so there is no Idempotency-Key.
        Requires command level 9: every voter must run a version that supports
        API tokens, otherwise 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenInput" }
      responses:
        "201":
          description: Created; the secret is in `token` (sent with Cache-Control no-store)
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api-tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: string, pattern: "^tok_[a-z2-7]{16}$" }
    delete:
      tags: [api-tokens]
      operationId: revokeApiToken
      summary: Revoke an API token
      description: |
        Tenant admins and platform admins, with an interactive login only. The
        token stops working at once on the leader and on the voters that applied
        the change. Its audit entries stay.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # --- Audit log (FA-DAT-01, ADR 0031) -------------------------------------------
  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: List the audit log of the caller's tenant
      description: |
        Tenant admins and platform admins; API tokens with the role tenant-admin
        may read it too. Newest first. Entries name the actor, action and object;
        they never contain documents, field values or secrets.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AuditLimit"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/FilterAction"
        - $ref: "#/components/parameters/FilterObjectKind"
        - $ref: "#/components/parameters/FilterObjectId"
        - $ref: "#/components/parameters/FilterActor"
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Live stream (FA-AUTH-11) -------------------------------------------------
  /stream/ticket:
    post:
      tags: [stream]
      operationId: createStreamTicket
      summary: One-time ticket (30 s) for opening the WebSocket `/api/v1/stream?ticket=…`
      description: |
        The WebSocket itself is not described by OpenAPI. Messages are JSON
        objects of schema `StreamEvent`.
      responses:
        "201":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Cluster administration (FA-CLU-08, FA-PKI-02) ----------------------------
  /admin/join-tokens:
    post:
      tags: [cluster]
      operationId: createJoinToken
      summary: Create a one-time join token for a new voter or probe
      description: |
        Platform admins only. The token is returned exactly once and is never
        stored or shown again; it contains the fingerprint of the cluster CA,
        so a joining node can verify the CA it trusts. A token is single use
        and expires after `ttlMinutes`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinTokenRequest" }
      responses:
        "201":
          description: Join token (sent with Cache-Control no-store)
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/nodes:
    get:
      tags: [cluster]
      operationId: listClusterNodes
      summary: List the cluster members
      description: |
        Platform admins only. `warnings` names quorum risks: an even number of
        voters (2, 4, ...) or more than five voters (FA-CLU-11).
      responses:
        "200":
          description: Members of the Raft configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterNodeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/nodes/{nodeId}:
    parameters:
      - name: nodeId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [cluster]
      operationId: removeClusterNode
      summary: Remove a node from the cluster and revoke its certificates
      description: |
        Platform admins only. Nodes are never removed automatically. Any voter
        accepts the request and forwards it to the leader, which does the
        removal. The leader itself cannot be removed while it leads: transfer
        leadership first. The last voter cannot be removed.
      responses:
        "200":
          description: Node removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeRemoval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # --- System channels and system alerts (ADR 0025) ----------------------------
  /admin/system-channels:
    get:
      tags: [system-admin]
      operationId: listSystemChannels
      summary: List the system notification channels
      description: |
        Platform admins only. System channels belong to the reserved tenant
        `_system`, subscribe to the event `system` and receive system alerts
        (FA-OBS-01). Tenant admins cannot see or change them.
      responses:
        "200":
          description: System channels (secrets masked)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [system-admin]
      operationId: createSystemChannel
      summary: Create a system notification channel
      description: |
        Platform admins only. The tenant is always `_system`, never taken from
        the request. The event `system` is always included. Without `events`,
        the channel subscribes to `system` only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/system-channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [system-admin]
      operationId: getSystemChannel
      summary: Get a system notification channel
      responses:
        "200":
          description: Channel (secrets masked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [system-admin]
      operationId: updateSystemChannel
      summary: Update a system notification channel
      description: |
        Same rules as the tenant channels. An omitted URL or a masked value
        keeps the stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [system-admin]
      operationId: deleteSystemChannel
      summary: Delete a system notification channel
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/system-channels/{channelId}/test:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      tags: [system-admin]
      operationId: testSystemChannel
      summary: Send a test message to a system channel synchronously
      responses:
        "200":
          description: Delivery result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/system-alerts:
    get:
      tags: [system-admin]
      operationId: listSystemAlerts
      summary: List the system alerts
      description: |
        Platform admins only. Lists the replicated state of the system alerts
        (FA-OBS-01, ADR 0025), ordered by kind and subject. `details` holds
        measured values and node IDs only.
      parameters:
        - name: active
          in: query
          required: false
          description: Only active alerts (default) or all alerts including cleared ones
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: System alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SystemAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /tenant:
    get:
      tags: [tenant]
      operationId: getOwnTenant
      summary: Get the caller's tenant with its effective limits and usage
      description: |
        Every role. The tenant comes from the token (FA-TEN-02). The
        organization binding and other tenants' plans are not shown.
      responses:
        "200":
          description: Own tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnTenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/plans:
    get:
      tags: [tenant-admin]
      operationId: listPlans
      summary: List the plans
      description: Platform admins only. Ordered by ID. The plan `system` is not listed.
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [tenant-admin]
      operationId: getPlan
      summary: Get a plan
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tenant-admin]
      operationId: putPlan
      summary: Create or replace a plan
      description: |
        Platform admins only. The plan `system` cannot be changed. A lowered
        limit keeps the existing stock of the tenants on the plan; only new
        objects and shorter intervals are rejected (ADR 0029).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: Created or replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [tenant-admin]
      operationId: deletePlan
      summary: Delete a plan that no tenant uses
      description: The plans `default` and `system` cannot be deleted.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/tenants:
    get:
      tags: [tenant-admin]
      operationId: listTenants
      summary: List the tenants with plan, limits and usage
      description: Platform admins only. Ordered by ID. The tenant `_system` is not listed.
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tenant-admin]
      operationId: createTenant
      summary: Create a tenant
      description: |
        Platform admins only. Without `id` the server generates a UUID. IDs of
        deleted tenants are never reused.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/tenants/{tenantId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [tenant-admin]
      operationId: getTenant
      summary: Get a tenant with plan, limits and usage
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tenant-admin]
      operationId: updateTenant
      summary: Change name, plan, limit overrides or organization of a tenant
      description: |
        Platform admins only. Omitted fields stay unchanged. `limits` replaces
        all overrides; `{}` removes them. `orgId` rebinds the tenant, an empty
        string unbinds it. The organization of `default` is set by the server
        configuration and cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [tenant-admin]
      operationId: deleteTenant
      summary: Delete a suspended tenant with all its data
      description: |
        Platform admins only. The tenant must be suspended first, and
        `confirmName` must equal its name. Deletes all replicated data at once;
        every node then purges the tenant's metrics in the background. Copies
        in the Raft log and in backups remain until they are overwritten
        (ADR 0029). `default` and `_system` cannot be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantDelete" }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/tenants/{tenantId}/suspend:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [tenant-admin]
      operationId: suspendTenant
      summary: Suspend a tenant
      description: |
        Platform admins only. Its users are rejected with 403, its sessions
        revoked, its checks and alerts stop; data is kept. `default` and
        `_system` cannot be suspended.
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/tenants/{tenantId}/resume:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [tenant-admin]
      operationId: resumeTenant
      summary: Resume a suspended tenant
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /admin/audit:
    get:
      tags: [tenant-admin]
      operationId: listAdminAudit
      summary: List the audit log of all tenants
      description: |
        Platform admins only. Like `/audit`, with the optional filter `tenant`.
        Without it the entries of all tenants are listed, including the platform
        actions of the reserved tenant `_system`.
      parameters:
        - name: tenant
          in: query
          description: Only entries of this tenant; `_system` for platform actions
          schema: { type: string, maxLength: 64 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AuditLimit"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/FilterAction"
        - $ref: "#/components/parameters/FilterObjectKind"
        - $ref: "#/components/parameters/FilterObjectId"
        - $ref: "#/components/parameters/FilterActor"
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RefreshCookie:
      description: "`uc_refresh=…; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`"
      schema: { type: string }

  parameters:
    MonitorId:
      name: monitorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MaintenanceId:
      name: maintenanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `nextCursor` of the previous page
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    NodeFilter:
      name: node
      in: query
      description: Restrict to one node; omitted = consensus view
      schema: { type: string }
    AuditLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    FilterAction:
      name: action
      in: query
      description: Exact action, e.g. `monitor.update`
      schema: { type: string, maxLength: 64 }
    FilterObjectKind:
      name: objectKind
      in: query
      description: Exact object kind, e.g. `monitor`
      schema: { type: string, maxLength: 64 }
    FilterObjectId:
      name: objectId
      in: query
      schema: { type: string, maxLength: 64 }
    FilterActor:
      name: actor
      in: query
      description: ID of the actor (user ID or API token ID)
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-generated request ID (UUID). Retrying with the same key never
        creates a second object (FA-CLU-06).
      schema: { type: string, format: uuid }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, enum: [pulsequorum] }

  responses:
    BadRequest:
      description: Malformed request (parameters, headers or body)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Role does not allow this action or tenant limit reached
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found (also returned for objects of other tenants)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicting state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Request body failed validation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: No leader or this node is not the leader; retry after the Retry-After seconds
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limit or login throttling
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # --- Common -------------------------------------------------------------
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          description: Field errors for validation problems
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: "JSON pointer, e.g. /config/url" }
        message: { type: string }
    Role:
      type: string
      enum: [platform-admin, tenant-admin, tenant-editor, tenant-viewer]

    # --- System -------------------------------------------------------------
    Health:
      type: object
      required: [status, role, nodeName, version, commit, degraded]
      properties:
        status: { type: string, enum: [ok] }
        role: { type: string, enum: [voter, probe] }
        nodeName: { type: string }
        version: { type: string }
        commit: { type: string }
        degraded:
          type: boolean
          description: True while this voter has known no leader for DEGRADED_AFTER (ADR 0024)
        degradedSince:
          type: string
          format: date-time
          description: Start of the leaderless period, set while degraded
        partition:
          type: array
          items: { type: string }
          description: Sorted IDs of this voter and the reachable voters without a leader, set while degraded (ADR 0024)

    # --- Auth ---------------------------------------------------------------
    SetupRequest:
      type: object
      required: [setupToken, username, password]
      properties:
        setupToken: { type: string }
        username: { type: string, minLength: 3, maxLength: 64 }
        displayName: { type: string, maxLength: 128 }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    TokenResponse:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, minLength: 12, maxLength: 256, format: password }
    Me:
      type: object
      required: [id, username, tenantId, roles, authMode]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        tenantId: { type: string }
        tenantName: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        authMode: { type: string, enum: [local, oidc] }

    # --- Users --------------------------------------------------------------
    User:
      type: object
      required: [id, username, role, disabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        displayName: { type: string, maxLength: 128 }
        password: { type: string, minLength: 12, maxLength: 256, format: password }
        role: { $ref: "#/components/schemas/Role" }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string, maxLength: 128 }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        password:
          type: string
          minLength: 12
          maxLength: 256
          format: password
          description: Admin password reset; revokes the user's sessions

    # --- Monitors -----------------------------------------------------------
    MonitorStatus:
      type: string
      description: |
        Consensus status. DEGRADED = check passed with a warning (e.g. TLS expiry);
        PARTIAL = some nodes report DOWN but the DOWN rule is not met (phase 3).
      enum: [UP, DOWN, DEGRADED, PARTIAL, PENDING, MAINTENANCE, PAUSED, UNKNOWN]
    CheckStatus:
      type: string
      description: Result of a single check on a single node
      enum: [UP, DOWN, DEGRADED]
    ErrorClass:
      type: string
      enum: [dns, connect, tls, timeout, http_status, assertion, ssrf_blocked, internal]
    Assignment:
      type: object
      description: |
        Which nodes run the check (E1, ADR 0017). Only voters with the capability the
        monitor type requires are candidates; `nodes` lists node IDs from the node registry.
        - `all`: every candidate, healthy or not.
        - `count`: `count` healthy candidates chosen by rendezvous hashing over the monitor ID;
          if fewer are healthy, all healthy candidates run it.
        - `nodes`: the listed nodes, if they are candidates.
        Without a node registry (a single voter before its first registration) every node runs the check.
      required: [mode]
      properties:
        mode: { type: string, enum: [all, count, nodes], default: all }
        count:
          type: integer
          minimum: 1
          description: Required for mode `count`
        nodes:
          type: array
          description: Node IDs, required for mode `nodes`
          items: { type: string }
    ConsensusPolicy:
      type: string
      enum: [majority, any, all]
      default: majority
    MonitorInput:
      type: object
      required: [name, type, config, intervalSeconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        type: { type: string, description: Monitor type key from /monitor-types, example: http }
        config:
          type: object
          additionalProperties: true
          description: |
            Type-specific configuration, validated against the type's JSON schema.
            Fields marked `writeOnly` in that schema are secrets (ADR 0015): they are
            stored encrypted and returned as `***`. On update, `***` or an omitted
            field keeps the stored secret (same type only), a new value replaces it
            and an empty string removes it. `***` without a stored secret is a 422.
        intervalSeconds: { type: integer, minimum: 20, maximum: 86400, default: 60 }
        timeoutSeconds:
          type: integer
          minimum: 1
          description: Must not exceed 80 % of the interval (FA-MON-03). Default 0.8 × interval, max 48 s.
        retries: { type: integer, minimum: 0, maximum: 10, default: 1 }
        recoveryThreshold:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Consecutive successes needed to return to UP
        resendIntervalMinutes:
          type: integer
          minimum: 0
          default: 0
          description: Repeat DOWN notifications every N minutes; 0 = never
        assignment: { $ref: "#/components/schemas/Assignment" }
        consensusPolicy: { $ref: "#/components/schemas/ConsensusPolicy" }
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
        notificationChannelIds:
          type: array
          items: { type: string, format: uuid }
        paused: { type: boolean, default: false }
    Monitor:
      allOf:
        - $ref: "#/components/schemas/MonitorInput"
        - type: object
          required: [id, status, statusSince, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/MonitorStatus" }
            statusSince: { type: string, format: date-time }
            lastCheckAt: { type: string, format: date-time, nullable: true }
            lastLatencyMs: { type: integer, nullable: true }
            uptime24h:
              type: number
              format: double
              nullable: true
              description: Percentage 0–100, null if no data
            flapping:
              type: boolean
              readOnly: true
              default: false
              description: |
                True while the monitor flaps: six status changes within 30 min. Its
                alerts are then summarized (FA-ALR-06).
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MonitorPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Monitor" }
        nextCursor: { type: string, nullable: true }
    MonitorType:
      type: object
      required: [type, name, configSchema]
      properties:
        type: { type: string, example: http }
        name: { type: string, example: HTTP(S) }
        description: { type: string }
        requiresCapability:
          type: string
          description: Node capability needed to run this type (e.g. icmp)
        configSchema:
          type: object
          additionalProperties: true
          description: JSON Schema (draft 2020-12) of `MonitorInput.config`
    CheckResult:
      type: object
      required: [status, latencyMs, checkedAt, nodeId]
      properties:
        status: { $ref: "#/components/schemas/CheckStatus" }
        latencyMs: { type: integer }
        message: { type: string }
        errorClass: { $ref: "#/components/schemas/ErrorClass" }
        details:
          type: object
          additionalProperties: true
          description: Type-specific details, e.g. statusCode, resolvedIp, tlsExpiresAt, phase timings
        checkedAt: { type: string, format: date-time }
        nodeId: { type: string }
    Heartbeat:
      type: object
      required: [nodeId, ts, status, latencyMs]
      properties:
        nodeId: { type: string }
        ts: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CheckStatus" }
        latencyMs: { type: integer }
        errorClass: { $ref: "#/components/schemas/ErrorClass" }
        message: { type: string }
    HeartbeatPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Heartbeat" }
        nextCursor: { type: string, nullable: true }
    UptimeStats:
      type: object
      required: [range, uptimePercent, upSeconds, downSeconds, maintenanceSeconds, unknownSeconds, buckets]
      properties:
        range: { type: string, enum: [24h, 7d, 30d, 365d] }
        nodeId: { type: string, nullable: true }
        uptimePercent:
          type: number
          format: double
          nullable: true
          description: null if the whole range is unknown/maintenance
        upSeconds: { type: integer, format: int64 }
        downSeconds: { type: integer, format: int64 }
        maintenanceSeconds: { type: integer, format: int64 }
        unknownSeconds: { type: integer, format: int64 }
        latencyAvgMs: { type: number, format: double, nullable: true }
        latencyP95Ms: { type: number, format: double, nullable: true }
        buckets:
          type: array
          description: Hourly buckets for 24h/7d, daily buckets for 30d/365d
          items: { $ref: "#/components/schemas/UptimeBucket" }
    UptimeBucket:
      type: object
      required: [start, upSeconds, downSeconds, maintenanceSeconds, unknownSeconds]
      properties:
        start: { type: string, format: date-time }
        upSeconds: { type: integer, format: int64 }
        downSeconds: { type: integer, format: int64 }
        maintenanceSeconds: { type: integer, format: int64 }
        unknownSeconds: { type: integer, format: int64 }
        latencyAvgMs: { type: number, format: double, nullable: true }

    # --- Notifications ------------------------------------------------------
    NotificationKind:
      type: string
      enum: [shoutrrr, webhook]
    NotificationEvent:
      type: string
      enum: [down, up, degraded, partial, flapping, channel_failed, system]
      description: |
        `system` is reserved for the system channels (ADR 0025); tenant channels
        answer 400 when they request it.
    WebhookConfig:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        method: { type: string, enum: [POST, PUT], default: POST }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Stored encrypted; values are masked on read
        bodyTemplate:
          type: string
          description: |
            JSON template with placeholders such as {{monitor.name}}, {{status}},
            {{confirmed}}. Values are JSON-encoded on insertion (FA-ALR-07).
    NotificationChannelInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        url:
          type: string
          description: Shoutrrr URL (kind=shoutrrr). Write-only; omit on update to keep the stored value.
          writeOnly: true
        webhook: { $ref: "#/components/schemas/WebhookConfig" }
        events:
          type: array
          items: { $ref: "#/components/schemas/NotificationEvent" }
          default: [down, up]
          description: |
            Omitted on create: `down` and `up`, plus `flapping` and `channel_failed`
            once the cluster command level is 4 or higher (ADR 0023). System channels
            always get `system`; without `events` they get only `system`.
        isDefault:
          type: boolean
          default: false
          description: Attach to new monitors automatically
    NotificationChannel:
      type: object
      required: [id, name, kind, events, isDefault, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        maskedUrl:
          type: string
          example: "telegram://***@telegram?chats=@ops"
        webhook: { $ref: "#/components/schemas/WebhookConfig" }
        events:
          type: array
          items: { $ref: "#/components/schemas/NotificationEvent" }
        isDefault: { type: boolean }
        state:
          type: string
          enum: [ok, failing, disabled]
          description: "`disabled` after permanent errors such as HTTP 401/403/404 (FA-ALR-05)"
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    DeliveryResult:
      type: object
      required: [delivered]
      properties:
        delivered: { type: boolean }
        error: { type: string }
        durationMs: { type: integer }

    # --- System alerts (ADR 0025) -------------------------------------------
    SystemAlert:
      type: object
      required: [kind, subject, active, level, since, updated, details]
      properties:
        kind:
          type: string
          description: "Kind of the alert, e.g. voter_offline, replication_lag, clock_skew, quorum (ADR 0025)"
        subject:
          type: string
          description: "What the alert is about: a node ID, a certificate or the cluster"
        active: { type: boolean }
        level:
          type: integer
          format: int32
          minimum: 0
          description: "Expiry stage (certificates) or counter; 0 for plain alerts"
        since: { type: string, format: date-time, description: "When the alert became active or cleared" }
        updated: { type: string, format: date-time, description: "When the alert last changed" }
        details:
          type: object
          additionalProperties: true
          description: "Measured values and node IDs; never secrets or target error texts"
    # --- Maintenance --------------------------------------------------------
    MaintenanceWindowInput:
      type: object
      required: [name, monitorIds, schedule]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        monitorIds:
          type: array
          description: Empty = all monitors of the tenant
          items: { type: string, format: uuid }
        schedule: { $ref: "#/components/schemas/MaintenanceSchedule" }
        active: { type: boolean, default: true }
    MaintenanceSchedule:
      type: object
      description: |
        `once`: startsAt/endsAt. `recurring`: cron expression (5 fields, local time
        in `timezone`) plus durationMinutes, optionally bounded by startsAt/endsAt.
      required: [kind]
      properties:
        kind: { type: string, enum: [once, recurring] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cron: { type: string, example: "0 3 * * 0" }
        durationMinutes: { type: integer, minimum: 1, maximum: 10080 }
        timezone: { type: string, example: Europe/Berlin, default: UTC }
    MaintenanceWindow:
      allOf:
        - $ref: "#/components/schemas/MaintenanceWindowInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            nextStart: { type: string, format: date-time, nullable: true }
            inProgress: { type: boolean }
            createdAt: { type: string, format: date-time }

    # --- Incidents ----------------------------------------------------------
    Incident:
      type: object
      required: [id, monitorId, monitorName, startedAt, cause]
      properties:
        id: { type: string, format: uuid }
        monitorId: { type: string, format: uuid }
        monitorName: { type: string }
        startedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        cause: { type: string, description: Error message at the start of the incident }
        errorClass: { $ref: "#/components/schemas/ErrorClass" }
        affectedNodes:
          type: array
          items: { type: string }
        confirmed:
          type: boolean
          description: false if raised in degraded mode without quorum (phase 3)
        reevaluated:
          type: boolean
          description: true if the incident was added to a gap in the history after the quorum returned (FA-UPT-07, ADR 0024)
    IncidentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        nextCursor: { type: string, nullable: true }

    # --- API tokens and audit log (ADR 0031) ---------------------------------
    ApiToken:
      type: object
      required: [id, name, role, createdAt, expiresAt, expired, createdBy]
      properties:
        id: { type: string, pattern: "^tok_[a-z2-7]{16}$" }
        name: { type: string, maxLength: 64 }
        role: { $ref: "#/components/schemas/ApiTokenRole" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        expired: { type: boolean, description: True once expiresAt has passed }
        createdBy: { $ref: "#/components/schemas/AuditActor" }
    ApiTokenInput:
      type: object
      required: [name, role, expiresAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: Unique per tenant }
        role: { $ref: "#/components/schemas/ApiTokenRole" }
        expiresAt:
          type: string
          format: date-time
          description: Between one hour and 366 days from now
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret (uct_…). Shown exactly once; it is not stored.
    ApiTokenRole:
      type: string
      description: Role of an API token; never platform-admin (ADR 0031)
      enum: [tenant-viewer, tenant-editor, tenant-admin]
      # Explicit names: the values would collide with Role and NotificationEvent.
      x-enum-varnames: [ApiTokenViewer, ApiTokenEditor, ApiTokenAdmin]
    AuditActorKind:
      type: string
      enum: [user, api_token, system, unknown]
      # Explicit names: "system" would collide with NotificationEvent.
      x-enum-varnames: [AuditUser, AuditAPIToken, AuditSystem, AuditUnknown]
    AuditActor:
      type: object
      required: [kind, id, name]
      properties:
        kind: { $ref: "#/components/schemas/AuditActorKind" }
        id: { type: string }
        name: { type: string }
    AuditEntry:
      type: object
      required: [at, tenantId, actor, action, objectKind, objectId, requestId]
      properties:
        at: { type: string, format: date-time }
        tenantId: { type: string, description: "`_system` for platform actions" }
        actor: { $ref: "#/components/schemas/AuditActor" }
        action: { type: string, example: monitor.update }
        objectKind: { type: string, example: monitor }
        objectId: { type: string }
        requestId: { type: string, description: "Shared by all entries of one request, e.g. of a bulk action" }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextCursor: { type: string, nullable: true }

    # --- Bulk monitor actions (FA-MON-06, ADR 0031) ---------------------------
    BulkMonitorsInput:
      type: object
      required: [action, ids]
      properties:
        action: { type: string, enum: [pause, resume, delete, addTags, removeTags] }
        ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Required for addTags and removeTags; ignored otherwise
    BulkMonitorsResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BulkMonitorResult" }
    BulkMonitorResult:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        revision:
          type: integer
          description: Revision of the monitor after the action; absent for deleted monitors

    # --- Stream -------------------------------------------------------------
    StreamTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string }
        expiresAt: { type: string, format: date-time }
    StreamEvent:
      type: object
      description: Message on the WebSocket `/api/v1/stream`, filtered by the tenant of the ticket.
      required: [type, ts]
      properties:
        type: { type: string, enum: [heartbeat, state, incident, node] }
        ts: { type: string, format: date-time }
        monitorId: { type: string, format: uuid }
        heartbeat: { $ref: "#/components/schemas/Heartbeat" }
        status: { $ref: "#/components/schemas/MonitorStatus" }
        incident: { $ref: "#/components/schemas/Incident" }

    # --- Cluster administration -----------------------------------------------
    JoinTokenRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [voter, probe] }
        tenantId:
          type: string
          description: Only for probes; binds the probe to one tenant (FA-PRB-05)
        ttlMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 60
    JoinToken:
      type: object
      required: [token, expiresAt, role]
      properties:
        token:
          type: string
          description: One-time secret, shown only in this response
        expiresAt: { type: string, format: date-time }
        role: { type: string, enum: [voter, probe] }
        tenantId: { type: string }
    ClusterNode:
      type: object
      required: [id, address, voter, leader, self]
      properties:
        id: { type: string }
        address: { type: string }
        voter: { type: boolean }
        leader: { type: boolean }
        self: { type: boolean, description: "True for the node that answered the request" }
        name: { type: string, description: "Node name from the node registry; absent until the node registered" }
        version: { type: string, description: "Version of the binary from the node registry; absent until the node registered" }
        capabilities:
          type: array
          description: "Capabilities of the node, e.g. icmp (FA-CHK-31); absent until the node registered"
          items: { type: string }
        healthy:
          type: boolean
          description: "Health as the leader decided it (ADR 0017); absent until the node registered"
        healthChangedAt:
          type: string
          format: date-time
          description: "Time of the last health change, or of the registration; absent until the node registered"
        replicationLagMs:
          type: integer
          format: int64
          minimum: 0
          description: "How far this node's copy of the heartbeats replicated from that node lags behind, in milliseconds: time since the last complete anti-entropy round with it. Absent for the answering node itself and for peers it has not caught up with yet."
        replicationError:
          type: string
          description: "Last replication error with this node as seen by the answering node"
        clockOffsetMs:
          type: integer
          format: int64
          description: "Offset of that node's wall clock relative to the answering node, in milliseconds; positive means the node is ahead (ADR 0020). Estimated from GetStatus round trips of at most one second; absent for the answering node itself and while no fresh sample of the last two minutes exists."
        maxCommandVersion:
          type: integer
          format: int32
          minimum: 0
          description: "Highest command version the node's binary supports, from the node registry (ADR 0018); absent until the node registered"
        connectivityImpaired:
          type: boolean
          description: "Connectivity as the leader decided it (ADR 0022): true when the node's reference targets fail or its heartbeats deviate from the peers; absent until the node registered"
        connectivityReason:
          type: string
          enum: [reference, deviation]
          description: "Why the connectivity is impaired (ADR 0022); absent unless it is impaired"
        ssrfProtection:
          type: boolean
          description: "Whether SSRF protection is on for the node's checks and notifications (ADR 0030); absent while the node has not answered recently or is older than ADR 0030."
    ClusterNodeList:
      type: object
      required: [nodes, leaderId, warnings]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ClusterNode" }
        leaderId: { type: string, description: "Empty while no leader is known" }
        warnings:
          type: array
          items: { type: string }
        commandLevel:
          type: integer
          format: int32
          minimum: 0
          description: "Command version the cluster may use (ADR 0018); new features need all voters to support it"
        upgradePending:
          type: boolean
          description: "True while at least one registered voter supports a lower command version than another, i.e. a rolling update is in progress"
    NodeRemoval:
      type: object
      required: [votersLeft]
      properties:
        votersLeft: { type: integer, minimum: 0 }
        warning: { type: string }

    # --- Tenants and plans (ADR 0029) ---------------------------------------
    Limits:
      type: object
      description: |
        Tenant limits (FA-TEN-04). A missing or null field is unlimited.
        `maxStatusPages` and `maxPrivateProbes` are stored now and enforced
        once the features exist.
      additionalProperties: false
      properties:
        maxMonitors: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        minIntervalSeconds: { type: integer, nullable: true, minimum: 1, maximum: 1000000 }
        maxChannels: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        maxStatusPages: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        maxPrivateProbes: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
    Plan:
      type: object
      required: [id, name, limits, tenantCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        limits: { $ref: "#/components/schemas/Limits" }
        tenantCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlanInput:
      type: object
      required: [name, limits]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        limits:
          description: |
            Same fields as `Limits`. Unknown fields are rejected with 422, so a
            typo never means "unlimited" (ADR 0029).
          type: object
          additionalProperties: { type: integer, nullable: true }
    TenantUsage:
      type: object
      required: [monitors, channels]
      properties:
        monitors: { type: integer, minimum: 0 }
        channels: { type: integer, minimum: 0 }
        minIntervalSeconds:
          type: integer
          minimum: 1
          description: Shortest monitor interval; absent without monitors
    LimitExcess:
      type: object
      description: A limit the current stock exceeds, e.g. after a smaller plan (ADR 0029).
      required: [limit, allowed, actual]
      properties:
        limit: { type: string, enum: [maxMonitors, minIntervalSeconds, maxChannels] }
        allowed: { type: integer }
        actual: { type: integer }
    Tenant:
      type: object
      required: [id, name, plan, limits, effectiveLimits, suspended, source, usage, exceeded, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string }
        orgId:
          type: string
          description: Bound identity-provider organization; absent if unbound
        limits:
          description: Per-tenant overrides; a null field lifts the plan limit
          type: object
          additionalProperties: { type: integer, nullable: true }
        effectiveLimits: { $ref: "#/components/schemas/Limits" }
        suspended: { type: boolean }
        source: { type: string, enum: [admin, auto, bootstrap] }
        usage: { $ref: "#/components/schemas/TenantUsage" }
        exceeded:
          type: array
          items: { $ref: "#/components/schemas/LimitExcess" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TenantCreate:
      type: object
      required: [name]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
        name: { type: string, minLength: 1, maxLength: 100 }
        plan: { type: string, default: default }
        orgId: { type: string, minLength: 1, maxLength: 128 }
        limits:
          type: object
          additionalProperties: { type: integer, nullable: true }
    TenantUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        plan: { type: string }
        orgId: { type: string, maxLength: 128 }
        limits:
          type: object
          additionalProperties: { type: integer, nullable: true }
    TenantDelete:
      type: object
      required: [confirmName]
      properties:
        confirmName: { type: string }
    OwnTenant:
      type: object
      required: [id, name, plan, effectiveLimits, usage, exceeded]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string }
        effectiveLimits: { $ref: "#/components/schemas/Limits" }
        usage: { $ref: "#/components/schemas/TenantUsage" }
        exceeded:
          type: array
          items: { $ref: "#/components/schemas/LimitExcess" }
